name: Tank's AI Radar · collect & deploy

on:
  schedule:
    # Daily 08:00 Asia/Shanghai (00:00 UTC)
    - cron: "0 0 * * *"
    # Lean sources update Sunday evening Asia/Shanghai (12:10 UTC)
    - cron: "10 12 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect public sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 collectors/run.py

      - name: Build static site
        run: python3 build.py

      - name: Persist snapshots
        run: |
          git config user.name "Tank's AI Radar Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/radar data/leaderboard_snapshot.csv data/companies.json
          git diff --cached --quiet || git commit -m "chore: update radar data [skip ci]"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
